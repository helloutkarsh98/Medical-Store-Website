
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found | MedQuick</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f5faf7;
            font-family: Arial, sans-serif;
            color: #18352a;
            text-align: center;
        }

        .error-card {
            max-width: 480px;
            background: white;
            padding: 45px 30px;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(24,53,42,.08);
        }

        .error-code {
            font-size: 76px;
            font-weight: 800;
            color: #13845b;
            margin: 0;
        }

        h1 { font-size: 27px; }

        p {
            color: #718378;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 13px 24px;
            background: #13845b;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        a:hover { background: #086b49; }
    </style>
</head>
<body>
    <main class="error-card">
        <p class="error-code">404</p>
        <h1>Oops! Page not found</h1>
        <p>
            The page you're looking for may have moved
            or doesn't exist anymore.
        </p>
        <a href="/">Back to MedQuick Home</a>
    </main>
</body>
</html>
